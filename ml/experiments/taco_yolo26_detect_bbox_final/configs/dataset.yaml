# BinSight final detector — dataset definition.
#
# Detection only. Labels are five-value YOLO Detect rows produced from
# annotation["bbox"]; no segmentation polygon ever reaches this dataset. See
# reports/detection_only_audit.md for the runtime proof.
#
# `path` is written as an absolute path by scripts/write_dataset_yaml.py because
# Ultralytics resolves a *relative* `path:` against its own DATASETS_DIR setting
# rather than against this file's location. This file is regenerated rather than
# hand-edited, and is gitignored for that reason.

path: PLACEHOLDER
train: images/train
val: images/val
test: images/test

names:
  0: bag_wrapper
  1: bottle
  2: bottle_cap
  3: can
  4: carton
  5: cigarette
  6: cup
  7: straw
