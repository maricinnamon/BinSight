# Ultralytics dataset definition for the BinSight TACO detector.
#
# `names` order must match configs/classes.txt and the class IDs written into
# data/prepared/labels/. All three are generated together by
# scripts/build_class_mapping.py and scripts/convert_coco_to_yolo.py.

path: <PROJECT_ROOT>/ml/experiments/taco_yolo26_detector/data/prepared
train: images/train
val: images/val
test: images/test

names:
  0: bag_wrapper
  1: bottle
  2: bottle_cap
  3: can
  4: carton
  5: cigarette
  6: cup
  7: straw

# NOTE ON `path:` — <PROJECT_ROOT> is a PLACEHOLDER, not a usable path.
# The absolute path was redacted before publishing this repository. Substitute
# the repository root before use, e.g.:
#   sed -i '' "s|<PROJECT_ROOT>|$(git rev-parse --show-toplevel)|" <this file>
# Ultralytics resolves a *relative* `path:` against its own DATASETS_DIR setting,
# not against this file's location, which is why a plain relative path is wrong
# here rather than merely inconvenient.
