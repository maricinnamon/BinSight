# Ultralytics dataset definition — BinSight final detector.
#
# Same eight classes and same IDs as Run 001 and Run 002: the taxonomy has not
# moved, so per-class numbers stay comparable across the whole experiment series.
#
# train/ holds the 748 original recovered-TACO training scenes PLUS 1056
# object-centric crops generated only from those same training images.
# val/ and test/ are byte-identical to Run 002's — original full scenes only, no
