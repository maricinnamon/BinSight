# BinSight YOLO26n — Training Run 001
#
# A clean pretrained baseline. Only the parameters below are overridden; every
# other Ultralytics 8.4.9 default is left alone on purpose, so Run 001 measures
# the dataset and the architecture rather than a hyperparameter guess.

model: yolo26n.pt
data: configs/dataset.yaml
task: detect

epochs: 100
patience: 20
imgsz: 640
batch: 8
device: mps
workers: 4
seed: 42
deterministic: true
pretrained: true
save: true
plots: true
verbose: true
project: runs
name: yolo26n_run_001
exist_ok: false

# --- Decisions and why ----------------------------------------------------
#
# imgsz 640
#   The audit shows 67% of TACO objects occupy under 1% of the frame, which is
#   an argument for going higher. 640 is kept for Run 001 anyway: it is the
#   Ultralytics default, it is the realistic target for eventual mobile
#   inference, and a baseline should measure one thing at a time. 768 is the
#   first thing to try in Run 002 if small objects are where this run fails.
#
# batch 8
#   This is an 8 GB M1. 8 is the conservative starting point; the ladder on OOM
#   is 8 -> 4 -> 2 before considering any device change.
#
# workers 4
#   Below the default of 8. MPS dataloader workers compete with the GPU for
#   unified memory on a machine this size.
#
# class weighting: NOT used
#   Imbalance after mapping is 5.18x (bag_wrapper 430 vs cup 83), which is
#   moderate. `cls_pw` does not exist in Ultralytics 8.4.9 — this was checked
#   against DEFAULT_CFG_DICT rather than assumed — so no weighting parameter is
#   passed. Default loss gains (box 7.5, cls 0.5, dfl 1.5) are unchanged.
#
# augmentation: Ultralytics defaults
#   Standard detection augmentation only. No custom transforms in Run 001: a
#   baseline first, experiments after.
