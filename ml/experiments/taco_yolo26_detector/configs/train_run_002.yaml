# BinSight YOLO26n — Training Run 002 (EXECUTED)
#
# The immutable record of what Run 002 was actually launched with. Its planned
# counterpart, configs/train_run_002_planned.yaml, is kept unchanged alongside it
# so the plan and the execution can be compared.
#
# Every value below was read out of runs/yolo26n_run_001/args.yaml — the settings
# Ultralytics resolved and used for Run 001 — not from memory and not from Run
# 001's requested config. The single intended difference is the dataset.

model: yolo26n.pt
data: configs/dataset_run_002.yaml
task: detect

epochs: 100
patience: 20
imgsz: 640
batch: 8
device: mps
workers: 4
seed: 42
deterministic: true
pretrained: true
save: true
plots: true
verbose: true
project: runs
name: yolo26n_run_002_full_taco_640
exist_ok: false

# --- Held identical to Run 001 (verified against its args.yaml) ------------
#
# optimizer: auto          lr0: 0.01           lrf: 0.01
# momentum: 0.937          weight_decay: 0.0005
# warmup_epochs: 3.0       warmup_momentum: 0.8   warmup_bias_lr: 0.1
# box: 7.5                 cls: 0.5            dfl: 1.5      nbs: 64
# mosaic: 1.0              close_mosaic: 10    mixup: 0.0    cutmix: 0.0
# copy_paste: 0.0          erasing: 0.4        auto_augment: randaugment
# hsv_h: 0.015             hsv_s: 0.7          hsv_v: 0.4
# degrees: 0.0             translate: 0.1      scale: 0.5    shear: 0.0
# perspective: 0.0         flipud: 0.0         fliplr: 0.5   bgr: 0.0
# multi_scale: 0.0         rect: false         cos_lr: false amp: true
# fraction: 1.0            freeze: null        dropout: 0.0  single_cls: false
#
# None of these are passed explicitly: they are Ultralytics 8.4.9 defaults and
# Run 001 used the defaults too. Passing them would risk a transcription error
# where doing nothing is exactly correct.
#
# No class weighting, as in Run 001 — `cls_pw` does not exist in this version.
# multi_scale stays 0.0: Run 001 did not use it, so neither does the ablation.
#
# --- The one difference ---------------------------------------------------
#
# data: configs/dataset.yaml  ->  configs/dataset_run_002.yaml
#   509 images / 1290 boxes   ->  1082 images / 2671 boxes
#
# Initialised from yolo26n.pt, NOT from Run 001's best.pt: fine-tuning the
# control would confound the data-volume ablation.
